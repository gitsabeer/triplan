<div class="travel-card">

  <p class="subtitle">
    {{ appState.t('SUBTITLE') }}
  </p>

  <form [formGroup]="form" (ngSubmit)="onSearch()">
    <div class="form-group">
      <label>{{ appState.t('FROM_CITY') }}</label>
      <input type="text" formControlName="from" placeholder="e.g. New York, USA" />
    </div>

    <div class="form-group">
      <label>{{ appState.t('DESTINATION') }}</label>
      <input type="text" formControlName="to" placeholder="e.g. Kyoto, Japan" />
    </div>

    <div class="row">
      <div class="form-group">
        <label>{{ appState.t('DEPART') }}</label>
        <input type="date" formControlName="departDate" />
      </div>

      <div class="form-group">
        <label>{{ appState.t('RETURN') }}</label>
        <input type="date" formControlName="returnDate" />
      </div>
    </div>

    <div class="row">
      <div class="form-group">
        <label>{{ appState.t('TRAVELERS') }}</label>
        <input type="number" formControlName="travelers" min="1" />
      </div>

      <div class="form-group">
        <label>{{ appState.t('BUDGET') }}</label>
        <select formControlName="budget">
          <option value="low">Low</option>
          <option value="moderate">Moderate</option>
          <option value="high">High</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label>{{ appState.t('INTERESTS') }}</label>
      <div class="tags">
        <span *ngFor="let tag of interests" class="tag" [class.active]="selectedInterests.includes(tag)"
          (click)="toggleInterest(tag)">
          {{ tag }}
        </span>
      </div>
    </div>

    <button type="submit" class="cta">{{ appState.t('EXPLORE') }}</button>
  </form>
</div>
